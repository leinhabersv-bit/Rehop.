openapi: 3.1.0
info:
  title: RideRescue Simulation API
  description: Synthetic cab-provider simulation for a hackathon. No real bookings.
  version: 0.1.0
paths:
  /api/v1/intent/parse:
    post:
      tags:
      - RideRescue simulation
      summary: Parse Intent
      operationId: parse_intent_api_v1_intent_parse_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseIntentRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/journeys/{journey_id}/driver-message:
    post:
      tags:
      - RideRescue simulation
      summary: Driver Message
      operationId: driver_message_api_v1_journeys__journey_id__driver_message_post
      parameters:
      - name: journey_id
        in: path
        required: true
        schema:
          type: string
          title: Journey Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverMessageRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/locations:
    get:
      tags:
      - RideRescue simulation
      summary: Locations
      operationId: locations_api_v1_locations_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/quotes:
    post:
      tags:
      - RideRescue simulation
      summary: Get Quotes
      operationId: get_quotes_api_v1_quotes_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/journeys:
    post:
      tags:
      - RideRescue simulation
      summary: Create Journey
      operationId: create_journey_api_v1_journeys_post
      parameters:
      - name: scenario
        in: query
        required: false
        schema:
          enum:
          - S01
          - S03
          type: string
          description: Simulated pickup behavior.
          default: S01
          title: Scenario
        description: Simulated pickup behavior.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/journeys/{journey_id}:
    get:
      tags:
      - RideRescue simulation
      summary: Get Journey
      operationId: get_journey_api_v1_journeys__journey_id__get
      description: Returns the journey snapshot. For newly boarded rides, boarded_at is the UTC wall-clock time of confirmed boarding.
      parameters:
      - name: journey_id
        in: path
        required: true
        schema:
          type: string
          title: Journey Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/journeys/{journey_id}/book:
    post:
      tags:
      - RideRescue simulation
      summary: Book
      operationId: book_api_v1_journeys__journey_id__book_post
      description: A browser can book another ride after its current pickup journey ends.
      parameters:
      - name: journey_id
        in: path
        required: true
        schema:
          type: string
          title: Journey Id
      - name: x-ride-rider
        in: header
        required: false
        description: Browser booking identifier. Required on the public hosted API.
        schema:
          type: string
          format: uuid
      - name: x-ride-recent
        in: header
        required: false
        description: Comma-separated recent journey IDs for bookings made before browser booking identifiers were introduced.
        schema:
          type: string
          maxLength: 167
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '409':
          description: An active pickup journey exists, or the booking conflicts with the current journey state.
        '428':
          description: Browser booking identifier is missing on the hosted API.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/journeys/{journey_id}/events:
    get:
      tags:
      - RideRescue simulation
      summary: Events
      operationId: events_api_v1_journeys__journey_id__events_get
      parameters:
      - name: journey_id
        in: path
        required: true
        schema:
          type: string
          title: Journey Id
      - name: since_seq
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Since Seq
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/journeys/{journey_id}/rescue/approve:
    post:
      tags:
      - RideRescue simulation
      summary: Approve
      operationId: approve_api_v1_journeys__journey_id__rescue_approve_post
      parameters:
      - name: journey_id
        in: path
        required: true
        schema:
          type: string
          title: Journey Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/journeys/{journey_id}/cancel:
    post:
      tags:
      - RideRescue simulation
      summary: Cancel
      operationId: cancel_api_v1_journeys__journey_id__cancel_post
      parameters:
      - name: journey_id
        in: path
        required: true
        schema:
          type: string
          title: Journey Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/journeys/{journey_id}/pickup/confirm:
    post:
      tags:
      - RideRescue simulation
      summary: Confirm Pickup
      operationId: confirm_pickup_api_v1_journeys__journey_id__pickup_confirm_post
      description: Confirms boarding and returns the journey snapshot with boarded_at set to the UTC wall-clock time of confirmation. Retrying does not reset it.
      parameters:
      - name: journey_id
        in: path
        required: true
        schema:
          type: string
          title: Journey Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/journeys/{journey_id}/tick:
    post:
      tags:
      - RideRescue simulation
      summary: Tick Journey
      description: Development-only simulated clock advancement
      operationId: tick_journey_api_v1_journeys__journey_id__tick_post
      parameters:
      - name: journey_id
        in: path
        required: true
        schema:
          type: string
          title: Journey Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TickRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/scenarios:
    get:
      tags:
      - RideRescue simulation
      summary: Scenarios
      operationId: scenarios_api_v1_scenarios_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/scenarios/{scenario_id}/run:
    post:
      tags:
      - RideRescue simulation
      summary: Run Scenario
      operationId: run_scenario_api_v1_scenarios__scenario_id__run_post
      parameters:
      - name: scenario_id
        in: path
        required: true
        schema:
          type: string
          title: Scenario Id
      - name: seed
        in: query
        required: false
        schema:
          type: integer
          default: 2026
          title: Seed
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/scenarios/{scenario_id}/tick:
    post:
      tags:
      - RideRescue simulation
      summary: Tick Scenario
      operationId: tick_scenario_api_v1_scenarios__scenario_id__tick_post
      parameters:
      - name: scenario_id
        in: path
        required: true
        schema:
          type: string
          title: Scenario Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TickRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    ActionRequest:
      properties:
        idempotency_key:
          type: string
          minLength: 3
          title: Idempotency Key
        expected_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expected Version
      type: object
      required:
      - idempotency_key
      title: ActionRequest
    ApprovalRequest:
      properties:
        approved:
          type: boolean
          title: Approved
        idempotency_key:
          type: string
          minLength: 3
          title: Idempotency Key
        expected_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expected Version
      type: object
      required:
      - approved
      - idempotency_key
      title: ApprovalRequest
    BookRequest:
      properties:
        quote_id:
          type: string
          title: Quote Id
        idempotency_key:
          type: string
          minLength: 3
          title: Idempotency Key
        expected_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expected Version
      type: object
      required:
      - quote_id
      - idempotency_key
      title: BookRequest
    DriverMessageRequest:
      properties:
        text:
          type: string
          maxLength: 500
          minLength: 1
          title: Text
        idempotency_key:
          type: string
          minLength: 3
          title: Idempotency Key
      type: object
      required:
      - text
      - idempotency_key
      title: DriverMessageRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    JourneyCreate:
      properties:
        pickup:
          $ref: '#/components/schemas/Location'
        dropoff:
          $ref: '#/components/schemas/Location'
        policy:
          $ref: '#/components/schemas/RecoveryPolicy'
        need_by:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Need By
      type: object
      required:
      - pickup
      - dropoff
      title: JourneyCreate
    Location:
      properties:
        label:
          type: string
          minLength: 1
          title: Label
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
        lng:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lng
      type: object
      required:
      - label
      - lat
      - lng
      title: Location
    ParseIntentRequest:
      properties:
        text:
          type: string
          maxLength: 500
          minLength: 4
          title: Text
      type: object
      required:
      - text
      title: ParseIntentRequest
    QuoteRequest:
      properties:
        pickup:
          $ref: '#/components/schemas/Location'
        dropoff:
          $ref: '#/components/schemas/Location'
      type: object
      required:
      - pickup
      - dropoff
      title: QuoteRequest
    RecoveryPolicy:
      properties:
        auto_rebook_on_confirmed_driver_cancel:
          type: boolean
          title: Auto Rebook On Confirmed Driver Cancel
          default: false
        max_total_fare_inr:
          type: integer
          maximum: 100000.0
          minimum: 1.0
          title: Max Total Fare Inr
          default: 650
        max_recovery_attempts:
          type: integer
          maximum: 5.0
          minimum: 0.0
          title: Max Recovery Attempts
          default: 2
        preemptive_switch_requires_approval:
          type: boolean
          const: true
          title: Preemptive Switch Requires Approval
          default: true
        allow_same_provider_retry:
          type: boolean
          title: Allow Same Provider Retry
          default: true
        max_cancellation_fee_inr:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Max Cancellation Fee Inr
          default: 100
      type: object
      title: RecoveryPolicy
    TickRequest:
      properties:
        steps:
          type: integer
          maximum: 180.0
          minimum: 1.0
          title: Steps
          default: 1
      type: object
      title: TickRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
