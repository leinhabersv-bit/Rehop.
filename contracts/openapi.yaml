components:
  schemas:
    ActionRequest:
      properties:
        idempotency_key:
          type: string
          minLength: 3
          title: Idempotency Key
        expected_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expected Version
      type: object
      required:
      - idempotency_key
      title: ActionRequest
    ApprovalRequest:
      properties:
        approved:
          type: boolean
          title: Approved
        idempotency_key:
          type: string
          minLength: 3
          title: Idempotency Key
        expected_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expected Version
      type: object
      required:
      - approved
      - idempotency_key
      title: ApprovalRequest
    BookRequest:
      properties:
        quote_id:
          type: string
          title: Quote Id
        idempotency_key:
          type: string
          minLength: 3
          title: Idempotency Key
        expected_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expected Version
      type: object
      required:
      - quote_id
      - idempotency_key
      title: BookRequest
    DriverMessageRequest:
      properties:
        text:
          type: string
          maxLength: 500
          minLength: 1
          title: Text
        idempotency_key:
          type: string
          minLength: 3
          title: Idempotency Key
      type: object
      required:
      - text
      - idempotency_key
      title: DriverMessageRequest
    ErrorEnvelope:
      properties:
        error:
          $ref: '#/components/schemas/ErrorPayload'
      type: object
      required:
      - error
      title: ErrorEnvelope
    ErrorPayload:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        retryable:
          type: boolean
          title: Retryable
          default: false
      type: object
      required:
      - code
      - message
      title: ErrorPayload
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InjectRequest:
      properties:
        kind:
          type: string
          enum:
          - FORCE_MODE
          - DRIVER_CANCEL
          - DRIVER_MESSAGE
          - FORCE_CONFIRM_RESULT
          - FORCE_CANCEL_RESULT
          - BACKUP_UNAVAILABLE
          - FARE_SURGE
          - NEED_BY
          title: Kind
        params:
          additionalProperties: true
          type: object
          title: Params
      type: object
      required:
      - kind
      - params
      title: InjectRequest
    JourneyCreate:
      properties:
        pickup:
          $ref: '#/components/schemas/Location'
        dropoff:
          $ref: '#/components/schemas/Location'
        policy:
          $ref: '#/components/schemas/RecoveryPolicy'
        need_by:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Need By
      type: object
      required:
      - pickup
      - dropoff
      title: JourneyCreate
    Location:
      properties:
        label:
          type: string
          minLength: 1
          title: Label
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
        lng:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lng
      type: object
      required:
      - label
      - lat
      - lng
      title: Location
    ParseIntentRequest:
      properties:
        text:
          type: string
          maxLength: 500
          minLength: 4
          title: Text
      type: object
      required:
      - text
      title: ParseIntentRequest
    PlayRequest:
      properties:
        speed:
          type: integer
          enum:
          - 1
          - 2
          - 5
          - 10
          - 20
          title: Speed
      type: object
      required:
      - speed
      title: PlayRequest
    PlaybackState:
      properties:
        playing:
          type: boolean
          title: Playing
        speed:
          type: integer
          enum:
          - 1
          - 2
          - 5
          - 10
          - 20
          title: Speed
      type: object
      required:
      - playing
      - speed
      title: PlaybackState
    QuoteRequest:
      properties:
        pickup:
          $ref: '#/components/schemas/Location'
        dropoff:
          $ref: '#/components/schemas/Location'
      type: object
      required:
      - pickup
      - dropoff
      title: QuoteRequest
    RecoveryPolicy:
      properties:
        auto_rebook_on_confirmed_driver_cancel:
          type: boolean
          title: Auto Rebook On Confirmed Driver Cancel
          default: false
        max_total_fare_inr:
          type: integer
          maximum: 100000.0
          minimum: 1.0
          title: Max Total Fare Inr
          default: 650
        max_recovery_attempts:
          type: integer
          maximum: 5.0
          minimum: 0.0
          title: Max Recovery Attempts
          default: 2
        preemptive_switch_requires_approval:
          type: boolean
          const: true
          title: Preemptive Switch Requires Approval
          default: true
        allow_same_provider_retry:
          type: boolean
          title: Allow Same Provider Retry
          default: true
        max_cancellation_fee_inr:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Max Cancellation Fee Inr
          default: 100
      type: object
      title: RecoveryPolicy
    TickRequest:
      properties:
        steps:
          type: integer
          maximum: 180.0
          minimum: 1.0
          title: Steps
          default: 1
      type: object
      title: TickRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          additionalProperties: true
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
