name: ReHop checks
on:
  push:
  pull_request:
jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: scripts/check.sh --all
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-test@127.0.0.1:5432/postgres
      - run: python -m pip install -r eval/requirements.txt
        working-directory: .
      - run: python -m eval.run_benchmark --trips 500 --seed 2026
        working-directory: .
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r services/api/requirements.txt
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
